<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0a0f18">
<meta name="color-scheme" content="dark">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' capacitor: https://localhost http://localhost; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' capacitor: https://localhost http://localhost; worker-src 'self' blob:">
<title>DroneForge</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app-container">
  <header id="top-header">
    <div class="brand-section">
      <div class="brand-logo" aria-hidden="true">DF</div>
      <div class="brand-text">
        <span class="brand-title">DroneForge</span>
        <span class="brand-version" id="screen-title">Atelier moteur</span>
      </div>
    </div>
    <div class="header-telemetry" aria-live="polite">
      <div class="head-stat"><span class="head-stat-label">Configuration</span><span class="head-stat-val text-cyan" id="header-preset-name">—</span></div>
      <div class="head-stat"><span class="head-stat-label">Moteurs</span><span class="head-stat-val" id="header-kv">—</span></div>
      <div class="head-stat"><span class="head-stat-label">Poussée totale (4×)</span><span class="head-stat-val text-emerald" id="header-thrust">—</span></div>
      <div class="head-stat"><span class="head-stat-label">Poussée / poids</span><span class="head-stat-val" id="header-twr">—</span></div>
      <div class="head-stat"><span class="head-stat-label">Alimentation</span><span class="head-stat-val text-amber" id="header-voltage">—</span></div>
    </div>
    <div class="head-actions">
      <button class="btn small desk-only" id="btn-export" type="button">Exporter</button>
      <button class="btn small desk-only" id="btn-import" type="button">Importer</button>
      <button class="icon-btn" id="btn-menu" type="button" aria-label="Menu" aria-haspopup="dialog">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="5" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="12" cy="19" r="1.8"/></svg>
      </button>
    </div>
  </header>

  <nav id="nav-tabs-bar" role="tablist" aria-label="Modules">
    <button class="nav-tab" role="tab" data-tab="motor" id="tabbtn-motor" aria-controls="tab-motor">
      <svg class="nav-ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="2.6"/><path d="M12 3.5v4M12 16.5v4M3.5 12h4M16.5 12h4M6 6l2.8 2.8M15.2 15.2 18 18M18 6l-2.8 2.8M8.8 15.2 6 18"/></svg>
      <span class="num">1</span><span class="lbl-long">Atelier moteur 3D</span><span class="lbl-short">Moteur</span></button>
    <button class="nav-tab" role="tab" data-tab="simulation" id="tabbtn-simulation" aria-controls="tab-simulation">
      <svg class="nav-ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="5.5" cy="5.5" r="3"/><circle cx="18.5" cy="5.5" r="3"/><circle cx="5.5" cy="18.5" r="3"/><circle cx="18.5" cy="18.5" r="3"/><path d="M7.7 7.7l2.6 2.6M16.3 7.7l-2.6 2.6M7.7 16.3l2.6-2.6M16.3 16.3l-2.6-2.6"/><rect x="9.6" y="9.6" width="4.8" height="4.8" rx="1"/></svg>
      <span class="num">2</span><span class="lbl-long">Simulation de vol 6-DoF</span><span class="lbl-short">Vol</span></button>
    <button class="nav-tab" role="tab" data-tab="ai" id="tabbtn-ai" aria-controls="tab-ai">
      <svg class="nav-ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="4.5" cy="7" r="2"/><circle cx="4.5" cy="17" r="2"/><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/><circle cx="19.5" cy="12" r="2"/><path d="M6.4 7.4 10 11.3M6.4 6.6l3.7-1.3M6.4 16.6 10 12.7M6.4 17.4l3.7 1.3M14 5.6l3.9 5.2M14 12h3.5M14 18.4l3.9-5.2"/></svg>
      <span class="num">3</span><span class="lbl-long">IA &amp; entraînement PPO</span><span class="lbl-short">IA</span><span class="dot" aria-hidden="true"></span></button>
    <button class="nav-tab" role="tab" data-tab="motherboard" id="tabbtn-motherboard" aria-controls="tab-motherboard">
      <svg class="nav-ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="1.5"/><rect x="9.5" y="9.5" width="5" height="5" rx=".6"/><path d="M9 2.5V6M15 2.5V6M9 18v3.5M15 18v3.5M2.5 9H6M2.5 15H6M18 9h3.5M18 15h3.5"/></svg>
      <span class="num">4</span><span class="lbl-long">Carte mère &amp; électronique</span><span class="lbl-short">Carte</span></button>
    <button class="nav-tab" role="tab" data-tab="production" id="tabbtn-production" aria-controls="tab-production">
      <svg class="nav-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.8 20.5 7.4v9.2L12 21.2l-8.5-4.6V7.4z"/><path d="M3.8 7.6 12 12l8.2-4.4M12 12v9"/></svg>
      <span class="num">5</span><span class="lbl-long">Production &amp; nomenclature</span><span class="lbl-short">BOM</span></button>
    <button class="nav-tab" role="tab" data-tab="lab" id="tabbtn-lab" aria-controls="tab-lab">
      <svg class="nav-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 2.8h6M10 3v6.2L4.6 18.4A1.8 1.8 0 0 0 6.2 21h11.6a1.8 1.8 0 0 0 1.6-2.6L14 9.2V3"/><path d="M7.3 14.5h9.4"/></svg>
      <span class="num">6</span><span class="lbl-long">Laboratoire IA</span><span class="lbl-short">Labo</span><span class="dot" aria-hidden="true"></span></button>
  </nav>

  <main id="workspace-body">
    <div id="viewport-3d-container">
      <div class="vp-top"><div class="pill" id="vp-hint"></div></div>
      <div class="vp-hud" id="vp-hud" hidden></div>
      <div class="vp-banner" id="vp-banner" hidden></div>
      <div class="vp-legend" id="vp-legend"></div>
      <div class="vp-tip" id="vp-tip" hidden></div>
      <div class="vp-sticks" id="vp-sticks" hidden>
        <div class="stick" id="stick-left" aria-label="Manche gauche : altitude et cap"><div class="stick-knob"></div><span class="stick-lbl">Altitude · cap</span></div>
        <div class="stick" id="stick-right" aria-label="Manche droit : avant, arrière et côtés"><div class="stick-knob"></div><span class="stick-lbl">Déplacement</span></div>
      </div>
    </div>
    <aside id="side-panel">
      <div class="tab-panel" id="tab-motor" role="tabpanel" aria-labelledby="tabbtn-motor"></div>
      <div class="tab-panel" id="tab-simulation" role="tabpanel" aria-labelledby="tabbtn-simulation" hidden></div>
      <div class="tab-panel" id="tab-ai" role="tabpanel" aria-labelledby="tabbtn-ai" hidden></div>
      <div class="tab-panel" id="tab-motherboard" role="tabpanel" aria-labelledby="tabbtn-motherboard" hidden></div>
      <div class="tab-panel" id="tab-production" role="tabpanel" aria-labelledby="tabbtn-production" hidden></div>
      <div class="tab-panel" id="tab-lab" role="tabpanel" aria-labelledby="tabbtn-lab" hidden></div>
    </aside>
  </main>
</div>
<div id="modal-root"></div>
<div id="toast" role="status" hidden></div>

<script src="vendor/three.min.js"></script>
<script src="vendor/OrbitControls.js"></script>
<script src="js/native.js"></script>
<script src="js/core.js"></script>
<script src="js/lab.js"></script>
<script src="js/app.js"></script>
</body>
</html>
