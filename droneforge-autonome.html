<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>DroneForge - Jumeau numérique intégral pour drones autonomes</title>
<meta name="description" content="Atelier moteur 3D, simulation de vol 6-DoF, entraînement PPO, carte mère et nomenclature de production pour drones multirotors.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23ff8a3d'/%3E%3Ctext x='16' y='21' font-family='monospace' font-weight='800' font-size='13' text-anchor='middle' fill='%231c0e04'%3EDF%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: one-screen engineering studio — header telemetry, module tabs, 3D viewport left + instrument panel right */
:root{
  --bg:#0a0f18; --bg-2:#0d1420; --panel:#101826; --panel-2:#16202f; --line:#1f2c41; --line-2:#2b3c56;
  --fg:#dfe7f1; --muted:#8597ae; --dim:#5a6b83;
  --accent:#ff8a3d; --accent-ink:#1c0e04; --cyan:#5cc8ff; --good:#3ddc97; --warn:#ffc24b; --bad:#ff6b6b;
  --phase-a:#ffb340; --phase-b:#5cc8ff; --phase-c:#c98bff;
  --glass:rgba(9,14,22,.82);
  --font-ui:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:8px;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:400 13px/1.45 var(--font-ui);overflow:hidden;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.text-cyan{color:var(--cyan)} .text-emerald{color:var(--good)} .text-amber{color:var(--warn)} .text-accent{color:var(--accent)}

#app-container{height:100%;display:grid;grid-template-rows:auto auto minmax(0,1fr)}

/* ---------- En-tête ---------- */
#top-header{display:flex;align-items:center;gap:12px 20px;padding:10px 16px;background:var(--bg-2);border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand-section{display:flex;align-items:center;gap:10px;margin-right:auto}
.brand-logo{width:34px;height:34px;display:grid;place-items:center;border-radius:7px;background:var(--accent);color:var(--accent-ink);font:800 14px/1 var(--font-mono);letter-spacing:-.04em}
.brand-title{display:block;font-weight:800;font-size:15px;letter-spacing:-.01em}
.brand-version{display:block;font:500 10.5px/1.2 var(--font-mono);color:var(--muted);letter-spacing:.03em}
.header-telemetry{display:flex;flex-wrap:wrap;min-width:0}
.head-stat{padding:2px 14px;border-left:1px solid var(--line);min-width:0}
.head-stat-label{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.head-stat-val{display:block;font:600 13px/1.35 var(--font-mono);white-space:nowrap;font-variant-numeric:tabular-nums}
.head-actions{display:flex;gap:6px}

/* ---------- Onglets ---------- */
#nav-tabs-bar{display:flex;gap:2px;padding:0 10px;background:var(--bg-2);border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
#nav-tabs-bar::-webkit-scrollbar{display:none}
.nav-tab{display:flex;align-items:center;gap:8px;padding:10px 12px;border:0;background:none;color:var(--muted);font-weight:600;font-size:12.5px;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap}
.nav-tab .num{font:600 11px var(--font-mono);color:var(--dim);border:1px solid var(--line-2);border-radius:4px;padding:0 5px;line-height:17px}
.nav-tab:hover{color:var(--fg)}
.nav-tab[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.nav-tab[aria-selected="true"] .num{color:var(--accent-ink);background:var(--accent);border-color:var(--accent)}
.nav-tab .dot{width:6px;height:6px;border-radius:50%;background:var(--good);display:none}
.nav-tab.busy .dot{display:block;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}

/* ---------- Espace de travail ---------- */
#workspace-body{display:grid;grid-template-columns:minmax(0,1fr) 384px;min-height:0}
#viewport-3d-container{position:relative;min-height:0;min-width:0;background:radial-gradient(120% 90% at 50% 20%,#132036 0%,var(--bg) 70%);overflow:hidden}
#viewport-3d-container canvas{display:block;width:100%;height:100%;touch-action:none;outline:none}
#side-panel{border-left:1px solid var(--line);background:var(--panel);overflow-y:auto;min-height:0;scrollbar-width:thin;scrollbar-color:var(--line-2) transparent}

.vp-top{position:absolute;top:10px;left:10px;right:10px;display:flex;gap:8px;align-items:flex-start;pointer-events:none;flex-wrap:wrap}
.pill{background:var(--glass);border:1px solid var(--line-2);border-radius:999px;padding:5px 11px;font-size:11.5px;color:var(--muted);backdrop-filter:blur(6px)}
.pill b{color:var(--fg);font-weight:600}
.vp-legend{position:absolute;left:10px;bottom:10px;display:flex;flex-wrap:wrap;gap:6px 12px;max-width:calc(100% - 20px);background:var(--glass);border:1px solid var(--line-2);border-radius:var(--r);padding:7px 10px;font-size:11px;color:var(--muted);pointer-events:none}
.vp-legend:empty{display:none}
.vp-legend span{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.vp-legend i{width:10px;height:10px;border-radius:2px;display:inline-block}
.vp-banner{position:absolute;top:48px;left:50%;transform:translateX(-50%);background:var(--glass);border:1px solid var(--bad);color:var(--fg);border-radius:var(--r);padding:8px 12px;font-weight:600;display:flex;gap:10px;align-items:center;max-width:calc(100% - 24px)}
.vp-banner.warn{border-color:var(--warn)}
.vp-reset{position:absolute;right:calc(10px + env(safe-area-inset-right,0px));bottom:10px;background:var(--glass);border:1px solid var(--line-2);border-radius:999px;padding:6px 12px;font:600 11.5px var(--font-ui);color:var(--fg);cursor:pointer;backdrop-filter:blur(6px)}
.vp-reset:hover{border-color:var(--accent);color:var(--accent)}
.vp-tip{position:absolute;pointer-events:none;background:var(--glass);border:1px solid var(--line-2);border-radius:6px;padding:6px 9px;font-size:11.5px;max-width:240px;transform:translate(12px,12px)}
.vp-tip b{display:block;color:var(--fg)}
.vp-tip span{color:var(--muted)}
.vp-fallback{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:24px;color:var(--muted)}
.vp-fallback strong{display:block;color:var(--fg);font-size:15px;margin-bottom:6px}
.vp-hud{position:absolute;right:10px;top:10px;display:grid;gap:4px;background:var(--glass);border:1px solid var(--line-2);border-radius:var(--r);padding:8px 10px;font:500 11.5px/1.35 var(--font-mono);pointer-events:none;min-width:150px}
.vp-hud div{display:flex;justify-content:space-between;gap:12px}
.vp-hud span:first-child{color:var(--muted);font-family:var(--font-ui)}

/* ---------- Panneaux ---------- */
.tab-panel{display:block}
.panel-head{padding:14px 16px 12px;border-bottom:1px solid var(--line);display:grid;gap:4px}
.panel-head h2{margin:0;font-size:15px;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
.panel-head p{margin:0;color:var(--muted);font-size:12px;max-width:60ch}
.sec{padding:12px 16px 14px;border-bottom:1px solid var(--line);display:grid;gap:10px}
.sec>h3{margin:0;font:600 10.5px/1.2 var(--font-ui);text-transform:uppercase;letter-spacing:.1em;color:var(--muted);display:flex;justify-content:space-between;align-items:center;gap:8px}
.sec>h3 .aside{font:500 11px var(--font-mono);letter-spacing:0;text-transform:none;color:var(--dim)}
.note{margin:0;color:var(--muted);font-size:11.5px;line-height:1.5}
.ctl{display:grid;gap:3px}
.ctl-head{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.ctl-head label{font-size:12.5px}
.val{font:500 12px var(--font-mono);color:var(--cyan);font-variant-numeric:tabular-nums;white-space:nowrap}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:20px;background:transparent;margin:0;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:4px;background:var(--line-2);border-radius:2px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--fg);margin-top:-5px;border:2px solid var(--panel)}
input[type=range]::-moz-range-track{height:4px;background:var(--line-2);border-radius:2px}
input[type=range]::-moz-range-thumb{width:11px;height:11px;border-radius:50%;background:var(--fg);border:2px solid var(--panel)}
input[type=range]:focus-visible{outline:none}
input[type=range]:focus-visible::-webkit-slider-thumb{box-shadow:0 0 0 3px var(--cyan)}
input[type=range]:focus-visible::-moz-range-thumb{box-shadow:0 0 0 3px var(--cyan)}
select,input[type=number],textarea{background:var(--bg-2);border:1px solid var(--line-2);border-radius:6px;padding:6px 8px;width:100%;min-width:0}
textarea{font:400 11.5px/1.45 var(--font-mono);resize:vertical;min-height:160px}
.field{display:grid;gap:4px}
.field>label{font-size:12px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:7px 12px;border-radius:6px;border:1px solid var(--line-2);background:var(--panel-2);color:var(--fg);font-weight:600;font-size:12px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad)}
.btn.small{padding:4px 9px;font-size:11.5px}
.btn-row{display:flex;gap:6px;flex-wrap:wrap}
.btn-row .btn{flex:1 1 auto}
.seg{display:flex;border:1px solid var(--line-2);border-radius:7px;overflow:hidden}
.seg button{flex:1;padding:7px 6px;border:0;background:none;color:var(--muted);font-weight:600;font-size:12px;cursor:pointer;border-left:1px solid var(--line)}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"]{background:var(--panel-2);color:var(--fg);box-shadow:inset 0 -2px 0 var(--accent)}
.switch{display:flex;align-items:center;justify-content:space-between;gap:8px;cursor:pointer;font-size:12.5px}
.switch input{appearance:none;-webkit-appearance:none;width:30px;height:17px;border-radius:9px;background:var(--line-2);position:relative;cursor:pointer;flex:none;margin:0;transition:background .15s}
.switch input::after{content:"";position:absolute;top:2px;left:2px;width:13px;height:13px;border-radius:50%;background:var(--fg);transition:transform .15s}
.switch input:checked{background:var(--accent)}
.switch input:checked::after{transform:translateX(13px);background:var(--accent-ink)}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.kpis.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.kpi{background:var(--panel);padding:8px 10px;min-width:0}
.kpi-l{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi-v{font:600 16px/1.3 var(--font-mono);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi-v small{font-size:11px;color:var(--muted);font-weight:500;margin-left:3px}
.kpi.warn .kpi-v{color:var(--warn)} .kpi.bad .kpi-v{color:var(--bad)} .kpi.good .kpi-v{color:var(--good)}
.checks{list-style:none;margin:0;padding:0;display:grid;gap:7px}
.checks li{display:grid;grid-template-columns:8px 1fr;gap:9px;font-size:12px;line-height:1.45}
.checks li::before{content:"";width:8px;height:8px;border-radius:50%;margin-top:5px;background:var(--good)}
.checks li.warn::before{background:var(--warn)} .checks li.bad::before{background:var(--bad)} .checks li.info::before{background:var(--cyan)}
canvas.chart{width:100%;height:160px;display:block;background:var(--bg-2);border:1px solid var(--line);border-radius:var(--r)}
canvas.chart.tall{height:200px}
.legend-row{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--muted)}
.legend-row span{display:inline-flex;align-items:center;gap:6px}
.legend-row i{width:12px;height:3px;border-radius:2px;display:inline-block}
.bars{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.bar{display:grid;gap:4px;text-align:center;font:500 11px var(--font-mono)}
.bar-track{height:64px;background:var(--bg-2);border:1px solid var(--line);border-radius:5px;position:relative;overflow:hidden}
.bar-fill{position:absolute;left:0;right:0;bottom:0;background:var(--cyan);transition:height .08s linear}
.bar-fill.hot{background:var(--warn)}
.bar-label{color:var(--muted);font-family:var(--font-ui)}
.meter{display:grid;gap:4px}
.meter-head{display:flex;justify-content:space-between;font-size:12px;gap:8px}
.meter-head span:last-child{font-family:var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.meter-track{height:6px;background:var(--bg-2);border:1px solid var(--line);border-radius:4px;overflow:hidden}
.meter-fill{height:100%;background:var(--good)}
.meter-fill.warn{background:var(--warn)} .meter-fill.bad{background:var(--bad)}
.stack{display:flex;height:12px;border-radius:4px;overflow:hidden;border:1px solid var(--line)}
.stack div{height:100%}
.wp-list{display:grid;gap:4px}
.wp-item{display:grid;grid-template-columns:22px 1fr auto;gap:8px;align-items:center;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg-2);cursor:pointer;font:500 11.5px var(--font-mono);text-align:left;color:var(--fg)}
.wp-item .n{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;background:var(--line-2);font-size:10.5px}
.wp-item[aria-pressed="true"]{border-color:var(--accent)}
.wp-item[aria-pressed="true"] .n{background:var(--accent);color:var(--accent-ink)}
.wp-item.active .n{box-shadow:0 0 0 2px var(--cyan)}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{padding:4px 9px;border-radius:999px;border:1px solid var(--line-2);background:var(--bg-2);font-size:11.5px;cursor:pointer;color:var(--fg)}
.chip[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.info-card{border:1px solid var(--line-2);border-radius:var(--r);padding:10px 12px;background:var(--bg-2);display:grid;gap:6px}
.info-card h4{margin:0;font-size:13.5px}
.info-card dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:12px}
.info-card dt{color:var(--muted)}
.info-card dd{margin:0;font-family:var(--font-mono);font-size:11.5px}
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r)}
table.bom{width:100%;border-collapse:collapse;font-size:11.5px}
table.bom th{position:sticky;top:0;background:var(--panel-2);text-align:left;font-weight:600;color:var(--muted);font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;padding:7px 8px;white-space:nowrap}
table.bom td{padding:6px 8px;border-top:1px solid var(--line);vertical-align:top}
table.bom td.num,table.bom th.num{text-align:right;font-family:var(--font-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
table.bom td .sub{display:block;color:var(--muted);font-size:10.5px}
table.bom tfoot td{font-weight:700;background:var(--panel-2)}
.ref{font-family:var(--font-mono);color:var(--dim);font-size:10.5px;white-space:nowrap}
.checklist{display:grid;gap:2px}
.checklist label{display:grid;grid-template-columns:18px 1fr;gap:8px;align-items:start;padding:5px 4px;border-radius:5px;cursor:pointer;font-size:12px}
.checklist label:hover{background:var(--panel-2)}
.checklist input{margin:2px 0 0;accent-color:var(--accent);width:14px;height:14px}
.checklist input:checked+span{color:var(--muted);text-decoration:line-through}
.progress{height:6px;border-radius:4px;background:var(--bg-2);border:1px solid var(--line);overflow:hidden}
.progress div{height:100%;background:var(--accent)}
.pad{display:grid;grid-template-columns:repeat(3,44px);grid-template-rows:repeat(3,36px);gap:4px;justify-content:center}
.pad button{border:1px solid var(--line-2);background:var(--bg-2);border-radius:6px;color:var(--fg);font:600 12px var(--font-mono);cursor:pointer;user-select:none;-webkit-user-select:none;touch-action:none}
.pad button.on{background:var(--accent);color:var(--accent-ink)}
.pad-wrap{display:flex;gap:16px;justify-content:center;flex-wrap:wrap}
kbd{font:500 10.5px var(--font-mono);border:1px solid var(--line-2);border-bottom-width:2px;border-radius:4px;padding:0 4px;color:var(--fg);background:var(--bg-2)}

/* ---------- Modale & notifications ---------- */
.modal-back{position:fixed;inset:0;background:rgba(3,6,12,.7);display:grid;place-items:center;z-index:50;padding:16px}
.modal{background:var(--panel);border:1px solid var(--line-2);border-radius:12px;width:min(560px,100%);max-height:90%;overflow:auto;padding:18px;display:grid;gap:12px}
.modal h2{margin:0;font-size:16px}
#toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--panel-2);border:1px solid var(--line-2);border-radius:8px;padding:9px 14px;font-size:12.5px;z-index:60;box-shadow:0 8px 30px rgba(0,0,0,.4);max-width:calc(100% - 32px)}

/* ---------- Laboratoire IA (pleine largeur) ---------- */
#workspace-body.lab-mode{grid-template-columns:minmax(0,1fr)}
#workspace-body.lab-mode #viewport-3d-container{display:none}
#workspace-body.lab-mode #side-panel{border-left:0}
.lab{display:grid;grid-template-columns:280px minmax(0,1fr);min-height:100%}
.lab-list{border-right:1px solid var(--line);padding:14px 12px;display:grid;gap:10px;align-content:start;background:var(--bg-2)}
.lab-list-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.lab-list-head h2{margin:0;font-size:15px}
.lab-list-head .aside{font:500 11px var(--font-mono);color:var(--dim)}
.lab-board-btn{border:1px dashed var(--line-2);background:none;border-radius:7px;padding:8px 10px;text-align:left;font-weight:600;font-size:12.5px;cursor:pointer;color:var(--fg)}
.lab-board-btn[aria-pressed="true"]{border-style:solid;border-color:var(--accent);color:var(--accent)}
.lab-cards{display:grid;gap:6px}
.lab-card{display:grid;gap:5px;text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:9px 10px;cursor:pointer;color:var(--fg);min-width:0}
.lab-card:hover{border-color:var(--line-2)}
.lab-card[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.lab-card-top{display:flex;justify-content:space-between;gap:8px;align-items:center;min-width:0}
.lab-card-name{font-weight:600;font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lab-card-meta{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;font:500 11px var(--font-mono);color:var(--muted)}
.tag{font:600 10.5px var(--font-ui);border:1px solid var(--line-2);border-radius:4px;padding:0 5px;line-height:17px;color:var(--fg)}
.lab-card-status{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted)}
.lab-card-status i{width:6px;height:6px;border-radius:50%;background:var(--good);flex:none}
.lab-card-status.idle i{background:var(--dim)}
.lab-card-status.run{color:var(--fg)}
.lab-card-status.run i{background:var(--accent);animation:pulse 1.2s ease-in-out infinite}
.grade{display:inline-grid;place-items:center;min-width:22px;height:20px;padding:0 5px;border-radius:5px;font:700 11.5px var(--font-mono);color:var(--bg);background:var(--g,var(--muted))}
.lab-main{min-width:0;display:grid;align-content:start}
.lab-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;padding:14px 16px;border-bottom:1px solid var(--line)}
.lab-head h2{margin:0;font-size:16px}
.lab-head .note{margin-top:4px}
.lab-title{display:grid;gap:6px;min-width:0;flex:1 1 280px}
.lab-name{font:700 16px var(--font-ui);background:transparent;border:1px solid transparent;border-radius:6px;padding:3px 6px;margin-left:-7px;width:100%;max-width:520px}
.lab-name:hover,.lab-name:focus{border-color:var(--line-2);background:var(--bg-2)}
.lab-main>.seg{margin:12px 16px 0;max-width:620px}
.lab-body{display:grid}
.lab-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px 18px}
.lab-grid.wide{grid-template-columns:repeat(auto-fill,minmax(290px,1fr))}
.lab-two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
.lab-two>.sec+.sec{border-left:1px solid var(--line)}
.lab-lock{margin:12px 16px 0;padding:9px 12px;border:1px solid color-mix(in srgb,var(--warn) 45%,transparent);background:color-mix(in srgb,var(--warn) 8%,transparent);border-radius:7px;font-size:12px;color:var(--fg);max-width:90ch}
.lab-arch{display:grid;gap:12px}
.lab-empty{padding:40px 24px;display:grid;gap:12px;max-width:820px}
.lab-empty h2{margin:0;font-size:20px;letter-spacing:-.01em;text-wrap:balance}
.lab-empty p{margin:0;color:var(--muted);max-width:65ch}
.tpl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.tpl{display:grid;gap:4px;text-align:left;padding:12px;border:1px solid var(--line-2);border-radius:8px;background:var(--bg-2);color:var(--fg);cursor:pointer}
.tpl:hover{border-color:var(--accent)}
.tpl b{font-size:13px}
.tpl span{font-size:12px;color:var(--muted)}
.lab-score{display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}
.lab-score-big{display:flex;align-items:baseline;gap:4px;font-family:var(--font-mono)}
.lab-score-big span{font-size:40px;font-weight:700;letter-spacing:-.03em;color:var(--g)}
.lab-score-big small{font-size:13px;color:var(--muted)}
.lab-score-big b{margin-left:10px;align-self:center;font-size:20px;padding:2px 10px;border-radius:7px;background:var(--g);color:var(--bg)}
.lab-verdict{margin:0 0 4px;font-size:13px;max-width:75ch}
.lab-table td .sub{display:block}
.lab-table tr.clickable{cursor:pointer}
.lab-table tr.clickable:hover td{background:var(--panel-2)}
.ci{display:flex;align-items:center;gap:8px;justify-content:flex-end}
.ci-bar{position:relative;width:70px;height:8px;background:var(--bg-2);border:1px solid var(--line);border-radius:4px}
.ci-bar i{position:absolute;top:1px;bottom:1px;background:color-mix(in srgb,var(--cyan) 45%,transparent);border-radius:2px}
.ci-bar b{position:absolute;top:-2px;width:2px;height:10px;margin-left:-1px;background:var(--fg)}
.dotc{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px;vertical-align:middle}
.heat-cell{background:hsl(var(--h) 55% 22%);color:#eef3f8}
@media (max-width:1100px){ .head-stat:nth-child(n+5){display:none} }
@media (max-width:900px){
  .lab{grid-template-columns:minmax(0,1fr)}
  .lab-list{border-right:0;border-bottom:1px solid var(--line)}
  .lab-cards{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
  .lab-two{grid-template-columns:minmax(0,1fr)}
  .lab-two>.sec+.sec{border-left:0}
  .lab-score{grid-template-columns:minmax(0,1fr)}
  body{overflow:auto}
  #app-container{height:auto;min-height:100%;grid-template-rows:auto auto auto}
  #workspace-body{grid-template-columns:minmax(0,1fr)}
  #viewport-3d-container{height:56vh;min-height:300px}
  #side-panel{border-left:0;border-top:1px solid var(--line);overflow:visible}
  .head-stat{padding:2px 10px}
  .vp-hud{display:none}
}
@media (max-width:520px){
  .header-telemetry{width:100%;order:3}
  .head-stat:first-child{border-left:0;padding-left:0}
  .head-stat:nth-child(n+4){display:none}
  .nav-tab .lbl-long{display:none}
}
@media (min-width:521px){ .nav-tab .lbl-short{display:none} }
@media (prefers-reduced-motion:reduce){ *{transition:none!important;animation:none!important} }

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
/* =====================================================================
   DroneForge — noyau de calcul (aucune dépendance DOM ni Three.js)
   Modèle moteur/hélice, bilan de masse, nomenclature, simulation 6-DoF,
   pilote automatique et apprentissage PPO.
   ===================================================================== */
const DF = (() => {
  'use strict';
  const G = 9.81, RHO = 1.225, TAU = Math.PI * 2, DEG = Math.PI / 180;
  const clamp = (x, a, b) => (x < a ? a : x > b ? b : x);
  const fr = (x, d) => Number(x).toFixed(d).replace('.', ',');

  /* ---------- Catalogues ---------- */
  const PRESETS = {
    racing:    { label: 'Course 2306 (FPV Racing)', statorD: 23, statorH: 6,   kv: 2550, winding: '12N14P', cells: 4, capacity: 1300,  propD: 5.1, propP: 4.3, blades: 3, wheelbase: 220, frameMass: 115, esc: 55 },
    freestyle: { label: 'Freestyle 2207 (6S)',      statorD: 22, statorH: 7,   kv: 1950, winding: '12N14P', cells: 6, capacity: 1100,  propD: 5.1, propP: 3.6, blades: 3, wheelbase: 225, frameMass: 125, esc: 55 },
    longrange: { label: 'Longue portée 7" 2806.5',  statorD: 28, statorH: 6.5, kv: 1300, winding: '12N14P', cells: 6, capacity: 1800,  propD: 7,   propP: 4,   blades: 2, wheelbase: 315, frameMass: 165, esc: 45, gps: true, firmware: 'INAV' },
    micro:     { label: 'Micro 3" 1404',            statorD: 14, statorH: 4,   kv: 3800, winding: '9N12P',  cells: 4, capacity: 650,   propD: 3,   propP: 3,   blades: 3, wheelbase: 140, frameMass: 38,  esc: 25 },
    heavy:     { label: 'Cartographie 15" 4114',    statorD: 41, statorH: 14,  kv: 400,  winding: '24N22P', cells: 6, capacity: 10000, propD: 15,  propP: 5.5, blades: 2, wheelbase: 650, frameMass: 620, esc: 65, gps: true, firmware: 'ArduPilot', mcu: 'H743', video: 'hd' },
  };
  const WINDINGS = {
    '9N12P':  { slots: 9,  poles: 12, pattern: 'ABCABCABC' },
    '12N14P': { slots: 12, poles: 14, pattern: 'AabBCcaABbcC' },
    '24N22P': { slots: 24, poles: 22, pattern: 'AabBCcaABbcCaABbcCAabBCc' },
  };
  const ESC = {
    25: { maxS: 4, price: 30,  mass: 6 },
    35: { maxS: 6, price: 42,  mass: 9 },
    45: { maxS: 6, price: 55,  mass: 12 },
    55: { maxS: 6, price: 68,  mass: 15 },
    65: { maxS: 8, price: 85,  mass: 20 },
    80: { maxS: 8, price: 110, mass: 28 },
  };
  const MCU = {
    F405: { label: 'STM32F405', loopKHz: 8, uarts: 6, price: 35, mA: 120, size: 10, flashKB: 1024 },
    F722: { label: 'STM32F722', loopKHz: 8, uarts: 5, price: 45, mA: 140, size: 10, flashKB: 512 },
    H743: { label: 'STM32H743', loopKHz: 8, uarts: 8, price: 68, mA: 220, size: 14, flashKB: 2048 },
  };
  const IMU = {
    'ICM-42688-P': { gyroKHz: 8,   price: 0,  noise: 'faible' },
    'BMI270':      { gyroKHz: 3.2, price: -3, noise: 'moyen' },
    'MPU6000':     { gyroKHz: 8,   price: 4,  noise: 'moyen (composant en fin de vie)' },
  };
  const VIDEO = {
    none:   { label: 'Aucune', mass: 0, uart: 0, loads: [] },
    analog: { label: 'Analogique (caméra + VTX 400 mW)', mass: 14, uart: 1, loads: [{ rail: '5V', mA: 150, label: 'Caméra analogique' }, { rail: '10V', mA: 330, label: 'Émetteur vidéo 400 mW' }] },
    hd:     { label: 'Numérique HD', mass: 36, uart: 1, loads: [{ rail: 'VBAT', W: 9, label: 'Système vidéo HD' }] },
  };
  const FIRMWARES = ['Betaflight', 'INAV', 'ArduPilot'];
  const RAIL_LIMIT = { '5V': 2000, '10V': 2000 };

  const LIMITS = {
    statorD: [10, 50], statorH: [3, 20], kv: [150, 6000], cells: [2, 8], capacity: [300, 16000],
    propD: [2, 18], propP: [1, 10], blades: [2, 5], wheelbase: [80, 1000], frameMass: [15, 2000],
  };

  function defaultConfig() {
    const c = { preset: 'racing', mcu: 'F722', imu: 'ICM-42688-P', video: 'analog', gps: false, firmware: 'Betaflight' };
    applyPreset(c, 'racing');
    return c;
  }
  function applyPreset(c, key) {
    const p = PRESETS[key];
    if (!p) return c;
    for (const k of Object.keys(LIMITS)) c[k] = p[k];
    c.winding = p.winding; c.esc = p.esc;
    c.gps = !!p.gps; c.firmware = p.firmware || 'Betaflight';
    c.mcu = p.mcu || 'F722'; c.video = p.video || 'analog';
    c.preset = key;
    return c;
  }
  function sanitizeConfig(c) {
    const d = defaultConfig();
    const out = Object.assign({}, d, c || {});
    for (const [k, [a, b]] of Object.entries(LIMITS)) {
      const v = Number(out[k]);
      out[k] = Number.isFinite(v) ? clamp(v, a, b) : d[k];
    }
    out.cells = Math.round(out.cells); out.blades = Math.round(out.blades);
    if (!WINDINGS[out.winding]) out.winding = d.winding;
    if (!ESC[out.esc]) out.esc = d.esc;
    if (!MCU[out.mcu]) out.mcu = d.mcu;
    if (!IMU[out.imu]) out.imu = d.imu;
    if (!VIDEO[out.video]) out.video = d.video;
    if (!FIRMWARES.includes(out.firmware)) out.firmware = d.firmware;
    out.gps = !!out.gps;
    if (out.preset !== 'custom' && !PRESETS[out.preset]) out.preset = 'custom';
    return out;
  }
  function designation(c) {
    const h = c.statorH;
    const hs = Number.isInteger(h) ? String(h) : h.toFixed(1);
    return String(Math.round(c.statorD)).padStart(2, '0') + (h < 10 ? '0' : '') + hs;
  }

  /* ---------- Modèle moteur brushless + hélice ----------
     Équilibre : Kt·(Im − I0) = Q_hélice(ω),  Im = (V·d − Ke·ω)/R
     Hélice : T = Ct·ρ·n²·D⁴ ,  P = Cp·ρ·n³·D⁵                         */
  function motorParams(c) {
    const vol = c.statorD * c.statorD * c.statorH; // mm³ (indice de taille)
    const Rm = clamp(7.6e11 / (c.kv * c.kv * Math.pow(c.statorD, 4) * c.statorH), 0.008, 3);
    const Vnom = c.cells * 3.7;
    const I0 = 0.3 + c.kv * Vnom * 2e-5;
    const D = c.propD * 0.0254, pd = c.propP / c.propD;
    const bt = [0, 0.6, 1, 1.25, 1.42, 1.55][c.blades] || 1;
    const bp = [0, 0.55, 1, 1.32, 1.6, 1.85][c.blades] || 1;
    const Ct = (0.07 + 0.06 * pd) * bt;
    const Cp = (0.022 + 0.075 * pd * pd) * bp;
    const kvRad = c.kv * TAU / 60; // rad/s par volt
    const Ke = 1 / kvRad;
    const mass = vol < 3174 ? 32 * Math.pow(vol / 3174, 0.9) : 32 * Math.pow(vol / 3174, 0.68);
    return { vol, Rm, Rtot: Rm + 0.012, Vnom, I0, D, Ct, Cp, kvRad, Ke, mass, statorD: c.statorD, statorH: c.statorH };
  }
  function operatingPoint(mp, throttle, vbat) {
    vbat = vbat || mp.Vnom;
    throttle = clamp(throttle, 0, 1);
    const Vm = vbat * throttle;
    const zero = { throttle, rpm: 0, thrustN: 0, thrustG: 0, Im: 0, Ibat: 0, Pel: 0, Pmech: 0, eff: 0, gw: 0, tip: 0, cu: 0, iron: 0, temp: 25 };
    if (Vm < 0.05) return zero;
    const D5 = Math.pow(mp.D, 5);
    const Qp = w => { const n = w / TAU; return mp.Cp * RHO * n * n * D5 / TAU; };
    let lo = 0, hi = Vm * mp.kvRad;
    for (let i = 0; i < 60; i++) {
      const w = 0.5 * (lo + hi);
      const Im = (Vm - mp.Ke * w) / mp.Rtot;
      if (mp.Ke * (Im - mp.I0) > Qp(w)) lo = w; else hi = w;
    }
    const w = lo, n = w / TAU;
    const Im = Math.max(0, (Vm - mp.Ke * w) / mp.Rtot);
    const Ibat = Im * throttle;
    const thrustN = mp.Ct * RHO * n * n * Math.pow(mp.D, 4);
    const Pmech = Qp(w) * w;
    const Pel = vbat * Ibat;
    const cu = Im * Im * mp.Rm;
    const iron = mp.I0 * mp.Ke * w;
    const Rth = 75 / (mp.statorD * mp.statorH);
    return {
      throttle, rpm: w * 60 / TAU, thrustN, thrustG: thrustN / G * 1000, Im, Ibat, Pel, Pmech,
      eff: Pel > 0 ? Pmech / Pel : 0, gw: Pel > 0 ? (thrustN / G * 1000) / Pel : 0,
      tip: (w * mp.D / 2) / 343, cu, iron, temp: 25 + (cu + iron) * Rth,
    };
  }

  /* ---------- Électronique : charges par rail ---------- */
  function electronicsLoad(c) {
    const mcu = MCU[c.mcu];
    const loads = [
      { rail: '5V', mA: mcu.mA + 60, label: `Contrôleur de vol (${mcu.label}, IMU, baromètre, flash)` },
      { rail: '5V', mA: 110, label: 'Récepteur ExpressLRS' },
    ];
    if (c.gps) loads.push({ rail: '5V', mA: 55, label: 'Module GNSS + compas' });
    for (const l of VIDEO[c.video].loads) loads.push(Object.assign({}, l));
    const rails = { '5V': { mA: 0, limit: RAIL_LIMIT['5V'] }, '10V': { mA: 0, limit: RAIL_LIMIT['10V'] }, VBAT: { W: 0 } };
    for (const l of loads) { if (l.rail === 'VBAT') rails.VBAT.W += l.W; else rails[l.rail].mA += l.mA; }
    const watts = 5 * rails['5V'].mA / 1000 + 10 * rails['10V'].mA / 1000 + rails.VBAT.W;
    const ampsBat = (watts / 0.85) / (c.cells * 3.7);
    return { loads, rails, watts, ampsBat };
  }

  function wiring(totalA, motorA) {
    const conn = totalA < 35 ? 'XT30' : totalA < 75 ? 'XT60' : 'XT90';
    const awgB = totalA < 40 ? 16 : totalA < 80 ? 14 : totalA < 130 ? 12 : 10;
    const awgM = motorA < 15 ? 24 : motorA < 25 ? 22 : motorA < 40 ? 20 : motorA < 55 ? 18 : 16;
    return { conn, awgB, awgM };
  }

  /* ---------- Nomenclature (source unique des masses) ---------- */
  function buildBOM(c, mp, full) {
    const L = [];
    const add = (ref, cat, name, spec, qty, onboard, mass, price) => L.push({ ref, cat, name, spec, qty, onboard, mass, price });
    const esc = ESC[c.esc], mcu = MCU[c.mcu], imu = IMU[c.imu];
    const totalA = full.Ibat * 4 + 1;
    const w = wiring(totalA, full.Im);
    const shaft = c.statorD < 18 ? '1,5 mm' : c.statorD < 35 ? '5 mm' : '6 mm';
    const propMass = 0.055 * c.propD * c.propD * c.blades;
    const battMass = c.cells * (c.capacity * 0.024 + 8);
    const cRate = clamp(Math.ceil((totalA / (c.capacity / 1000)) * 1.2 / 5) * 5, 10, 150);
    const k = c.wheelbase / 220;
    add('FRM-01', 'Structure', `Châssis carbone X ${c.wheelbase} mm`, `Bras ${Math.max(3, Math.round(5 * Math.sqrt(k)))} mm, carbone 3K`, 1, 1, c.frameMass, 25 + 0.12 * c.wheelbase);
    add('MOT-01', 'Propulsion', `Moteur brushless ${designation(c)} ${c.kv} Kv`, `${c.winding}, arbre ${shaft}`, 4, 4, mp.mass, 6 + 0.27 * Math.sqrt(mp.vol));
    add('PRP-01', 'Propulsion', `Hélice ${c.propD}×${c.propP}×${c.blades}`, '2 CW + 2 CCW, 1 jeu de rechange', 8, 4, propMass, 0.2 + 0.03 * c.propD * c.propD * c.blades / 3);
    add('ESC-01', 'Électronique', `ESC 4-en-1 ${c.esc} A`, `${esc.maxS}S max, DShot bidirectionnel`, 1, 1, esc.mass, esc.price);
    add('FC-01', 'Électronique', `Contrôleur de vol ${mcu.label}`, `${c.imu}, baromètre, blackbox 16 Mo`, 1, 1, 8, mcu.price + imu.price);
    add('RX-01', 'Radio', 'Récepteur ExpressLRS 2,4 GHz', 'Antenne en T, télémétrie', 1, 1, 3, 15);
    if (c.video === 'analog') {
      add('CAM-01', 'Vidéo', 'Caméra analogique 1200 TVL', 'Capteur 1/3", 2,1 mm', 1, 1, 6, 25);
      add('VTX-01', 'Vidéo', 'Émetteur vidéo 5,8 GHz 400 mW', 'Contrôle SmartAudio', 1, 1, 8, 25);
    } else if (c.video === 'hd') {
      add('VID-01', 'Vidéo', 'Système vidéo numérique HD', 'Caméra + émetteur, enregistrement 4K', 1, 1, 36, 190);
    }
    if (c.gps) add('GPS-01', 'Navigation', 'Module GNSS M10 + compas', 'UART + I²C', 1, 1, 10, 22);
    add('BAT-01', 'Énergie', `Batterie LiPo ${c.cells}S ${c.capacity} mAh`, `${(c.cells * 3.7).toFixed(1)} V nominal, ${cRate}C`, 1, 1, battMass, 6 + 0.0048 * c.capacity * c.cells);
    add('CON-01', 'Énergie', `Connecteur ${w.conn}`, 'Paire mâle + femelle', 1, 1, w.conn === 'XT90' ? 9 : w.conn === 'XT60' ? 4 : 2, w.conn === 'XT90' ? 3.5 : 2);
    add('CBL-01', 'Énergie', `Câble silicone ${w.awgB} AWG`, '0,2 m rouge + noir', 1, 1, 0.012 * Math.pow(2, (16 - w.awgB) / 3) * 200 / 10, 3);
    add('CBL-02', 'Propulsion', `Câble moteur ${w.awgM} AWG`, '12 conducteurs, 0,1 m', 1, 1, 2 + 0.008 * c.wheelbase, 2);
    add('CAP-01', 'Énergie', `Condensateur low-ESR 1000 µF ${c.cells >= 5 ? 50 : 35} V`, 'Monté sur les pads batterie', 1, 1, 4, 1.5);
    add('HW-01', 'Structure', 'Kit visserie M3 / M2 inox', 'Vis, écrous nylstop, entretoises', 1, 1, 10 * Math.sqrt(k), 4);
    add('HW-02', 'Structure', 'Sangle batterie kevlar + pad', 'Une sangle de rechange', 2, 1, 4, 3.5);
    add('HW-03', 'Structure', 'Gaine thermo, colliers, silent-blocs', 'Lot', 1, 1, 3, 3);
    return { lines: L, wiring: w, cRate, battMass, propMass };
  }

  /* ---------- Synthèse complète d'une configuration ---------- */
  function summarize(cIn) {
    const c = sanitizeConfig(cIn);
    const mp = motorParams(c);
    const full = operatingPoint(mp, 1);
    const bom = buildBOM(c, mp, full);
    const auwG = bom.lines.reduce((s, l) => s + l.mass * l.onboard, 0);
    const thrustMaxG = full.thrustG * 4;
    const twr = thrustMaxG / auwG;
    let hover = null;
    if (twr > 1.0001) {
      let lo = 0, hi = 1;
      for (let i = 0; i < 40; i++) { const m = 0.5 * (lo + hi); if (operatingPoint(mp, m).thrustG * 4 < auwG) lo = m; else hi = m; }
      hover = operatingPoint(mp, hi);
    }
    const elec = electronicsLoad(c);
    const hoverBatA = hover ? hover.Ibat * 4 + elec.ampsBat : null;
    const flightMin = hover ? (c.capacity / 1000 * 0.8) / hoverBatA * 60 : 0;
    const tau = 0.012 + 0.0004 * c.propD * c.propD * Math.sqrt(c.blades / 3);
    const kq = mp.Cp * mp.D / (TAU * mp.Ct);
    const armL = c.wheelbase / 2000;
    const m = auwG / 1000, mm = mp.mass / 1000;
    const mb = Math.max(0.01, m - 4 * mm);
    const sb = c.wheelbase / 1000 * 0.35;
    const Ib = mb * sb * sb / 6;
    const inertia = [2 * mm * armL * armL + Ib, 4 * mm * armL * armL + Ib * 1.2, 2 * mm * armL * armL + Ib];
    const table = [];
    for (let i = 0; i <= 40; i++) { const op = operatingPoint(mp, i / 40); table.push([op.thrustN, op.Ibat]); }
    return {
      cfg: c, mp, full, hover, bom, auwG, thrustMaxG, twr, elec, hoverBatA, flightMin,
      tau, kq, armL, inertia, table, CdA: 0.012 * Math.pow(c.wheelbase / 220, 2),
      Rint: c.cells * 0.008 * 1300 / c.capacity, capacityAh: c.capacity / 1000, cells: c.cells,
      elecA: elec.ampsBat, designation: designation(c),
      noiseHz: hover ? hover.rpm / 60 : 0, bpfHz: hover ? hover.rpm / 60 * c.blades : 0,
    };
  }

  /* ---------- Vérifications (moteur + électronique) ---------- */
  function motorChecks(s) {
    const c = s.cfg, out = [];
    const esc = ESC[c.esc];
    if (s.twr < 1) out.push(['bad', `Poussée insuffisante : ${fr(s.twr, 2)}:1. Le drone ne décolle pas.`]);
    else if (s.twr < 2) out.push(['warn', `Rapport poussée/poids faible (${fr(s.twr, 1)}:1). Visez au moins 2:1, 5:1 et plus pour la course.`]);
    else out.push(['good', `Rapport poussée/poids ${fr(s.twr, 1)}:1.`]);
    if (s.hover && s.hover.throttle > 0.7) out.push(['warn', `Gaz au stationnaire élevés (${Math.round(s.hover.throttle * 100)} %) : peu de marge de manœuvre.`]);
    if (s.full.Im > c.esc) out.push(['bad', `Courant moteur à plein gaz ${fr(s.full.Im, 1)} A > ESC ${c.esc} A.`]);
    else if (s.full.Im > c.esc * 0.85) out.push(['warn', `Courant moteur ${fr(s.full.Im, 1)} A proche de la limite ESC (${c.esc} A).`]);
    else out.push(['good', `Courant moteur ${fr(s.full.Im, 1)} A, ESC ${c.esc} A suffisant.`]);
    if (c.cells > esc.maxS) out.push(['bad', `Batterie ${c.cells}S au-dessus de la tension maximale de l'ESC (${esc.maxS}S).`]);
    if (s.full.tip > 0.75) out.push(['bad', `Bout de pale à Mach ${fr(s.full.tip, 2)} : pertes et bruit importants. Réduisez le Kv ou le diamètre.`]);
    else if (s.full.tip > 0.62) out.push(['warn', `Bout de pale à Mach ${fr(s.full.tip, 2)} : rendement dégradé.`]);
    if (s.full.temp > 110) out.push(['bad', `Échauffement à plein gaz continu ≈ ${Math.round(s.full.temp)} °C : bobinage en danger.`]);
    else if (s.full.temp > 90) out.push(['warn', `Échauffement à plein gaz continu ≈ ${Math.round(s.full.temp)} °C. Acceptable en rafales courtes seulement.`]);
    const noLoad = c.kv * c.cells * 4.2;
    if (noLoad > 50000) out.push(['warn', `Régime à vide ${Math.round(noLoad).toLocaleString('fr-FR')} tr/min : roulements très sollicités.`]);
    if (s.hover && s.flightMin < 3) out.push(['warn', `Autonomie au stationnaire courte (${fr(s.flightMin, 1)} min).`]);
    return out;
  }
  function boardChecks(s) {
    const c = s.cfg, out = [];
    const mcu = MCU[c.mcu], imu = IMU[c.imu], esc = ESC[c.esc];
    const ratio = s.full.Im / c.esc;
    out.push([ratio > 1 ? 'bad' : ratio > 0.85 ? 'warn' : 'good', `ESC ${c.esc} A pour ${fr(s.full.Im, 1)} A par moteur à plein gaz (${Math.round(ratio * 100)} %).`]);
    out.push([c.cells > esc.maxS ? 'bad' : 'good', `Tension : batterie ${c.cells}S, ESC limité à ${esc.maxS}S.`]);
    const loop = Math.min(mcu.loopKHz, imu.gyroKHz);
    out.push([loop < 4 ? 'warn' : 'good', `Boucle gyro/PID à ${loop.toLocaleString('fr-FR')} kHz${imu.gyroKHz < mcu.loopKHz ? ` (limitée par le ${c.imu})` : ''}.`]);
    const need = 1 + VIDEO[c.video].uart + (c.gps ? 1 : 0) + 1;
    out.push([need > mcu.uarts ? 'bad' : 'good', `Ports série : ${need} utilisés sur ${mcu.uarts} (récepteur${c.video !== 'none' ? ', vidéo' : ''}${c.gps ? ', GPS' : ''}, télémétrie).`]);
    for (const r of ['5V', '10V']) {
      const R = s.elec.rails[r];
      if (!R.mA) continue;
      const p = R.mA / R.limit;
      out.push([p > 1 ? 'bad' : p > 0.8 ? 'warn' : 'good', `Régulateur ${r} : ${R.mA} mA sur ${R.limit} mA (${Math.round(p * 100)} %).`]);
    }
    if (c.firmware === 'ArduPilot' && c.mcu === 'F405') out.push(['warn', 'ArduPilot sur F405 : mémoire limitée, préférez un H743.']);
    if (c.firmware === 'INAV' && !c.gps) out.push(['warn', 'INAV sans GPS : les modes de navigation (retour maison, missions) sont indisponibles.']);
    if (c.firmware === 'Betaflight' && c.gps) out.push(['info', 'Betaflight + GPS : le retour de secours GPS Rescue est disponible.']);
    if (c.cells >= 5) out.push(['info', `Batterie ${c.cells}S : condensateur 50 V low-ESR obligatoire sur l'entrée ESC.`]);
    if (s.hover) out.push(['info', `Bruit moteur au stationnaire : ${Math.round(s.noiseHz)} Hz, passage de pales ${Math.round(s.bpfHz)} Hz. Activez le filtre RPM (DShot bidirectionnel).`]);
    return out;
  }

  /* ---------- Production ---------- */
  const DISCOUNTS = [[1000, 0.30], [100, 0.20], [25, 0.12], [10, 0.06], [1, 0]];
  function discountFor(qty) { for (const [q, d] of DISCOUNTS) if (qty >= q) return d; return 0; }
  function assemblyHours(c, qty) {
    const t1 = 75 + (c.video !== 'none' ? 15 : 0) + (c.gps ? 12 : 0) + (c.wheelbase > 400 ? 40 : 0);
    const b = Math.log2(0.85);
    let total = 0;
    const n = Math.min(qty, 20000);
    for (let i = 1; i <= n; i++) total += Math.max(t1 * 0.35, t1 * Math.pow(i, b));
    return { firstMin: t1, totalH: total / 60 };
  }
  const CHECKLIST = [
    'Contrôle à réception : références, quantités, état visuel des composants',
    'Montage des moteurs sur les bras (vis de longueur vérifiée, frein-filet)',
    'Soudure des fils moteurs sur l\'ESC 4-en-1',
    'Soudure du connecteur batterie et du condensateur low-ESR',
    'Première mise sous tension derrière un limiteur de courant (smoke stopper)',
    'Montage de la pile FC/ESC sur silent-blocs, nappe 8 broches',
    'Câblage récepteur, vidéo et GPS sur les ports série',
    'Flash du firmware, configuration des ports et du protocole DShot',
    'Calibrage de l\'accéléromètre et contrôle de l\'orientation de l\'IMU',
    'Sens de rotation des moteurs vérifié, hélices démontées',
    'Appairage radio, modes de vol et failsafe testés',
    'Montage des hélices (sens CW / CCW) et serrage des écrous',
    'Vol de test stationnaire et lecture de la blackbox',
  ];

  /* ---------- Outils mathématiques ---------- */
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function gauss(rng) { let u = 0; while (!u) u = rng(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(TAU * rng()); }
  function qMul(a, b) {
    return [
      a[0] * b[0] - a[1] * b[1] - a[2] * b[2] - a[3] * b[3],
      a[0] * b[1] + a[1] * b[0] + a[2] * b[3] - a[3] * b[2],
      a[0] * b[2] - a[1] * b[3] + a[2] * b[0] + a[3] * b[1],
      a[0] * b[3] + a[1] * b[2] - a[2] * b[1] + a[3] * b[0],
    ];
  }
  function qNormalize(q) { const n = Math.hypot(q[0], q[1], q[2], q[3]) || 1; return [q[0] / n, q[1] / n, q[2] / n, q[3] / n]; }
  function qToMat(q) {
    const [w, x, y, z] = q;
    return [
      1 - 2 * (y * y + z * z), 2 * (x * y - w * z), 2 * (x * z + w * y),
      2 * (x * y + w * z), 1 - 2 * (x * x + z * z), 2 * (y * z - w * x),
      2 * (x * z - w * y), 2 * (y * z + w * x), 1 - 2 * (x * x + y * y),
    ];
  }
  const yawOf = R => Math.atan2(R[2], R[8]);
  const yawQuat = psi => [Math.cos(psi / 2), 0, Math.sin(psi / 2), 0];
  const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
  const norm = a => Math.hypot(a[0], a[1], a[2]);

  /* ---------- Simulation 6-DoF ----------
     Repère : y vers le haut, avant = −z, droite = +x.
     Moteurs : 0 avant-droit, 1 arrière-gauche, 2 avant-gauche, 3 arrière-droit. */
  class QuadSim {
    constructor(s) { this.configure(s); this.reset(); }
    configure(s) {
      this.m = s.auwG / 1000;
      const a = s.armL * Math.SQRT1_2;
      this.a = a; this.rx = [a, -a, -a, a]; this.rz = [-a, a, -a, a]; this.sp = [1, 1, -1, -1];
      this.kq = s.kq; this.I = s.inertia.slice(); this.Tmax = s.full.thrustN; this.tau = s.tau;
      this.CdA = s.CdA; this.cells = s.cells; this.Vnom = s.cells * 3.7; this.capAh = s.capacityAh;
      this.Rint = s.Rint; this.table = s.table; this.elecA = s.elecA;
    }
    reset(pos) {
      this.p = pos ? pos.slice() : [0, 0, 0];
      this.v = [0, 0, 0]; this.acc = [0, 0, 0]; this.q = [1, 0, 0, 0]; this.w = [0, 0, 0];
      this.T = [0, 0, 0, 0]; this.soc = 1; this.Ibat = 0; this.armed = false; this.crashed = false;
      this.time = 0; this.flightTime = 0; this.onGround = true; this.crashReason = '';
    }
    vbat() { return Math.max(0, this.cells * (3.5 + 0.7 * clamp(this.soc, 0, 1)) - this.Ibat * this.Rint); }
    tmaxNow() { if (this.soc <= 0) return this.Tmax * 0.25; const r = this.vbat() / this.Vnom; return this.Tmax * Math.min(1.12, r * r); }
    _interp(T, col) {
      const tb = this.table, n = tb.length;
      if (T <= 0) return 0;
      for (let i = 1; i < n; i++) if (tb[i][0] >= T) { const f = (T - tb[i - 1][0]) / ((tb[i][0] - tb[i - 1][0]) || 1); return col === 'th' ? (i - 1 + f) / (n - 1) : tb[i - 1][1] + f * (tb[i][1] - tb[i - 1][1]); }
      return col === 'th' ? 1 : tb[n - 1][1];
    }
    throttleOf(i) { return this._interp(this.T[i] * this.Vnom * this.Vnom / Math.max(1, this.vbat() * this.vbat()), 'th'); }
    step(h, cmd, wind, infBattery) {
      const Tm = this.tmaxNow();
      const k = 1 - Math.exp(-h / this.tau);
      const live = this.armed && !this.crashed;
      let F = 0, tx = 0, ty = 0, tz = 0, Ib = 0;
      for (let i = 0; i < 4; i++) {
        const c = live ? clamp(cmd[i], 0, Tm) : 0;
        this.T[i] += (c - this.T[i]) * k;
        const T = this.T[i];
        F += T; tx += -this.rz[i] * T; tz += this.rx[i] * T; ty += this.sp[i] * this.kq * T;
        Ib += this._interp(T, 'I');
      }
      this.Ibat = Ib + (this.armed ? this.elecA : this.elecA * 0.5);
      if (!infBattery) this.soc = Math.max(0, this.soc - this.Ibat * h / (this.capAh * 3600));
      const R = qToMat(this.q);
      const up = [R[1], R[4], R[7]];
      const vr = [this.v[0] - wind[0], this.v[1] - wind[1], this.v[2] - wind[2]];
      const sp = norm(vr);
      const kd = 0.5 * RHO * this.CdA * sp / this.m;
      for (let j = 0; j < 3; j++) this.acc[j] = up[j] * F / this.m - kd * vr[j] - (j === 1 ? G : 0);
      for (let j = 0; j < 3; j++) { this.v[j] += this.acc[j] * h; this.p[j] += this.v[j] * h; }
      const I = this.I, w = this.w;
      const Iw = [I[0] * w[0], I[1] * w[1], I[2] * w[2]];
      const gyr = cross(w, Iw);
      const tau = [tx, ty, tz];
      for (let j = 0; j < 3; j++) w[j] += ((tau[j] - gyr[j] - I[j] * 0.6 * w[j]) / I[j]) * h;
      const dq = qMul(this.q, [0, w[0], w[1], w[2]]);
      this.q = qNormalize([this.q[0] + 0.5 * dq[0] * h, this.q[1] + 0.5 * dq[1] * h, this.q[2] + 0.5 * dq[2] * h, this.q[3] + 0.5 * dq[3] * h]);
      // Contact sol
      this.onGround = false;
      if (this.p[1] <= 0) {
        this.p[1] = 0;
        const impact = -this.v[1];
        const tilt = Math.acos(clamp(up[1], -1, 1));
        const hspeed = Math.hypot(this.v[0], this.v[2]);
        if (!this.crashed && (impact > 4.5 || (tilt > 65 * DEG && (impact > 0.6 || hspeed > 1.5)))) {
          this.crashed = true;
          this.crashReason = impact > 4.5 ? `Impact vertical à ${impact.toFixed(1)} m/s` : `Contact au sol incliné à ${Math.round(tilt / DEG)}°`;
        }
        if (this.v[1] < 0) this.v[1] = 0;
        const f = Math.max(0, 1 - 10 * h);
        this.v[0] *= f; this.v[2] *= f;
        if (F < this.m * G * 1.02) {
          this.q = yawQuat(yawOf(qToMat(this.q)));
          this.w = [0, this.w[1] * f, 0];
        }
        this.onGround = true;
      }
      this.time += h;
      if (this.armed && !this.onGround) this.flightTime += h;
    }
    attitude() {
      const R = qToMat(this.q);
      return { roll: Math.asin(clamp(R[3], -1, 1)) / DEG, pitch: Math.asin(clamp(-R[5], -1, 1)) / DEG, yaw: yawOf(R) / DEG, R };
    }
  }

  function effectiveGains(g, tau) {
    const rate = Math.min(g.rate, 0.5 / tau);
    const att = Math.min(g.att, rate / 3);
    const vel = Math.min(g.vel, att / 2.2);
    const pos = Math.min(g.pos, vel / 2);
    return { rate, att, vel, pos };
  }

  /* Constante de temps de réponse en accélération, utilisée pour adapter l'entraînement au drone */
  function responseTau(s, gains) { const g = effectiveGains(gains, s.tau); return clamp(1.2 / g.att, 0.12, 0.8); }

  class Wind {
    constructor(seed) { this.g = [0, 0, 0]; this.rng = mulberry32(seed || 7); }
    step(h, mean, dirDeg, gust) {
      const d = dirDeg * DEG;
      const sigma = gust * (1 + 0.45 * mean);
      for (let j = 0; j < 3; j++) this.g[j] += -this.g[j] / 1.6 * h + sigma * (j === 1 ? 0.35 : 1) * Math.sqrt(h) * gauss(this.rng);
      return [Math.sin(d) * mean + this.g[0], this.g[1], -Math.cos(d) * mean + this.g[2]];
    }
  }

  /* Navigation par apprentissage : constantes partagées entre l'environnement d'entraînement et la simulation */
  const NAV = { AMAX: 6, DT: 0.05, TAU_A: 0.12, DRAG: 0.25, EP_LEN: 160, OBS: 9, ACT: 3 };
  function navObs(rel, v, accF) {
    const o = new Float64Array(9);
    for (let i = 0; i < 3; i++) { o[i] = clamp(rel[i] / 5, -3, 3); o[3 + i] = clamp(v[i] / 5, -3, 3); o[6 + i] = accF[i] / NAV.AMAX; }
    return o;
  }

  class Autopilot {
    constructor() { this.reset(); this.rng = mulberry32(99); }
    reset() {
      this.vint = [0, 0, 0]; this.yawDes = 0; this.accF = [0, 0, 0]; this.policyT = 0; this.policyCmd = [0, 0, 0];
      this.wp = 0; this.landing = false; this.altHold = 1.5; this.holdXZ = null;
    }
    takeoff(sim) {
      if (sim.crashed) return;
      sim.armed = true; this.landing = false; this.vint = [0, 0, 0]; this.assist = true; this.assistXZ = [sim.p[0], sim.p[2]];
      this.altHold = Math.max(1.5, sim.p[1]); this.yawDes = yawOf(qToMat(sim.q));
    }
    land(sim) { this.landing = true; this.holdXZ = [sim.p[0], sim.p[2]]; }
    step(sim, h, inp) {
      const g = effectiveGains(inp.gains, sim.tau);
      if (!sim.armed || sim.crashed) return [0, 0, 0, 0];
      // Mesures (bruit capteurs optionnel)
      const nz = inp.noise ? 1 : 0, r = this.rng;
      const p = sim.p.map(x => x + nz * 0.03 * gauss(r));
      const v = sim.v.map(x => x + nz * 0.05 * gauss(r));
      const w = sim.w.map(x => x + nz * 0.06 * gauss(r));
      const q = sim.q;
      let aCmd = null, vdes = null;
      const wps = inp.waypoints || [];
      const target = wps.length ? wps[this.wp % wps.length] : [0, 1.5, 0];
      if (inp.mode !== 'manual' && wps.length && !this.landing) {
        const d = Math.hypot(target[0] - sim.p[0], target[1] - sim.p[1], target[2] - sim.p[2]);
        if (d < inp.accept) this.wp = (this.wp + 1) % wps.length;
      }
      if (this.landing) {
        const hx = this.holdXZ || [p[0], p[2]];
        vdes = [g.pos * (hx[0] - p[0]), p[1] > 1.5 ? -1.4 : -0.6, g.pos * (hx[1] - p[2])];
        if (sim.onGround && Math.hypot(...sim.v) < 0.4) { sim.armed = false; this.landing = false; return [0, 0, 0, 0]; }
      } else if (inp.mode === 'manual') {
        const m = inp.manual;
        this.yawDes += m.yaw * 1.8 * h;
        const s = inp.vmax;
        const c = Math.cos(this.yawDes), sn = Math.sin(this.yawDes);
        const fwd = [-sn, 0, -c], right = [c, 0, -sn];
        if (m.up !== 0) this.altHold = Math.max(0.3, p[1]);
        vdes = [ (fwd[0] * m.fwd + right[0] * m.right) * s,
                 m.up !== 0 ? m.up * Math.min(3, s * 0.6) : g.pos * 1.5 * (this.altHold - p[1]),
                 (fwd[2] * m.fwd + right[2] * m.right) * s ];
      } else if (inp.mode === 'ai' && inp.policy && this.assist) {
        // Décollage assisté : la politique a été entraînée en l'air, le contrôleur classique la met en position
        const hx = this.assistXZ || [p[0], p[2]];
        vdes = [g.pos * (hx[0] - p[0]), 1.5, g.pos * (hx[1] - p[2])];
        if (sim.p[1] > 0.9) { this.assist = false; this.accF = [0, 0, 0]; this.policyT = 0; }
      } else if (inp.mode === 'ai' && inp.policy) {
        this.policyT -= h;
        if (this.policyT <= 0) {
          this.policyT += NAV.DT;
          const rel = [target[0] - p[0], target[1] - p[1], target[2] - p[2]];
          const a = inp.policy(navObs(rel, v, this.accF));
          for (let j = 0; j < 3; j++) this.policyCmd[j] = (Number.isFinite(a[j]) ? clamp(a[j], -1, 1) : 0) * (inp.amax || NAV.AMAX);
        }
        const k = 1 - Math.exp(-h / (inp.tauA || NAV.TAU_A));
        for (let j = 0; j < 3; j++) this.accF[j] += (this.policyCmd[j] - this.accF[j]) * k;
        aCmd = this.accF.slice();
        this.vint = [0, 0, 0];
      } else {
        const e = [target[0] - p[0], target[1] - p[1], target[2] - p[2]];

      const bell = new THREE.Mesh(new THREE.CylinderGeometry(rM, rM, hM * 0.65, 24), bellM); bell.position.y = hM * 0.35 + hM * 0.325; mg.add(bell);

    }
    const top = new THREE.Mesh(new THREE.BoxGeometry(0.045 * k, armT * 0.8, 0.095 * k), carbonTop); top.position.y = armT + 0.028; add(top, 0.04 * k);

  function applyCam(v, home) {
    if (!camera || !v) return;
    const okCam = c => c && Math.hypot(c.pos[0] - c.target[0], c.pos[1] - c.target[1], c.pos[2] - c.target[2]) > 1e-3;
    if (!v.home && okCam(v.cam)) v.home = JSON.parse(JSON.stringify(v.cam));
    if (!okCam(v.cam) && v.home) v.cam = JSON.parse(JSON.stringify(v.home));
    if (home && v.home) v.cam = JSON.parse(JSON.stringify(v.home));
    if (!v.cam) return;
    if (controls && v.home) {
      const d = Math.hypot(v.home.pos[0] - v.home.target[0], v.home.pos[1] - v.home.target[1], v.home.pos[2] - v.home.target[2]);
      controls.minDistance = d * 0.12; controls.maxDistance = d * (v.zoomMax || 4);
      controls.maxPolarAngle = Math.PI * 0.49;
    }
    camera.near = v.near; camera.far = v.far; camera.updateProjectionMatrix();
    camera.position.fromArray(v.cam.pos);
    if (controls) { controls.target.fromArray(v.cam.target); controls.update(); } else camera.lookAt(new THREE.Vector3().fromArray(v.cam.target));
  }

  function updateAIPanel(force) {

    K.setK('upd', fmtN(upd));
    K.setK('steps', st.steps ? fmtN(st.steps) : '—');
    K.setK('ret', st.recent.length ? fmtN(st.meanReturn(), 1) : '—');
    const ok = st.recent.length ? st.successRate() : sv ? sv.ok : null;
    K.setK('ok', ok == null ? '—' : fmtN(ok * 100), ok == null ? '' : ok > 0.9 ? 'good' : ok > 0.5 ? '' : 'warn');
    K.setK('std', fmtN(Math.exp(AI.agent.logStd.reduce((s, x) => s + x, 0) / 3), 2));
    K.setK('kl', st.updates ? fmtN(st.kl, 4) : '—', st.kl > 0.05 ? 'warn' : '');

          series: [{ data: h.map(x => [x.u, x.ret]), color: C.cyan, fill: true }, { data: h.map(x => [x.u, x.ok * 100]), color: C.good, axis: 'right' }] });

  function drawNet() {
    const cv = AP.net, dpr = Math.min(window.devicePixelRatio || 1, 2);
    const W = cv.clientWidth, H = cv.clientHeight; if (!W || !H) return;
    if (cv.width !== Math.round(W * dpr)) { cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); }
    const g = cv.getContext('2d'); g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, W, H);
    const pi = AI.agent.pi, show = [9, 14, 14, 3];
    const inL = ['Δx', 'Δy', 'Δz', 'vx', 'vy', 'vz', 'ax', 'ay', 'az'], outL = ['ax', 'ay', 'az'];
    const xs = show.map((_, i) => 34 + i * (W - 68) / 3);
    const ys = n => Array.from({ length: n }, (_, i) => 14 + (i + 0.5) * (H - 28) / n);
    const Ys = show.map(ys);
    for (let l = 0; l < 3; l++) {
      const ni = pi.sizes[l], Wl = pi.W[l];
      let mx = 1e-6; for (let o = 0; o < show[l + 1]; o++) for (let i = 0; i < show[l]; i++) mx = Math.max(mx, Math.abs(Wl[o * ni + i]));
      for (let o = 0; o < show[l + 1]; o++) for (let i = 0; i < show[l]; i++) {
        const w = Wl[o * ni + i], a = Math.abs(w) / mx;
        if (a < 0.15) continue;
        g.strokeStyle = w > 0 ? C.accent : C.cyan; g.globalAlpha = a * 0.55; g.lineWidth = 0.4 + a * 1.4;
        g.beginPath(); g.moveTo(xs[l], Ys[l][i]); g.lineTo(xs[l + 1], Ys[l + 1][o]); g.stroke();
      }
    }
    g.globalAlpha = 1;
    g.font = '10px ' + (cssv('--font-mono') || 'monospace');
    Ys.forEach((col, l) => col.forEach((y, i) => {
      g.fillStyle = C.panel2; g.strokeStyle = C.fg; g.lineWidth = 1; g.beginPath(); g.arc(xs[l], y, 3.6, 0, TAU); g.fill(); g.stroke();
      g.fillStyle = C.muted;
      if (l === 0) { g.textAlign = 'right'; g.fillText(inL[i], xs[l] - 8, y + 3); }
      if (l === 3) { g.textAlign = 'left'; g.fillText(outL[i], xs[l] + 8, y + 3); }
    }));
  }

    const btns = TABS.map(t => $('#tabbtn-' + t));
    btns.forEach((b, i) => {
      b.addEventListener('click', () => setTab(TABS[i]));
      b.addEventListener('keydown', e => {
        if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
        e.preventDefault();
        const j = (i + (e.key === 'ArrowRight' ? 1 : -1) + TABS.length) % TABS.length;
        setTab(TABS[j]); btns[j].focus();
      });
    });
  }

  /* ================= Projet : export / import ================= */
  function initProjectButtons() {
    $('#btn-export').addEventListener('click', () => {
      const txt = JSON.stringify({ format: 'droneforge-project-2', savedAt: new Date().toISOString(), state: S }, null, 2);
      const ta = el('textarea', { readonly: true, 'aria-label': 'Projet au format JSON' }, txt);
      modal('Exporter le projet', el('div', { class: 'field' }, el('p', { class: 'note' }, 'Configuration, points de passage, réglages et liste d\'assemblage. Les poids de l\'IA s\'exportent depuis le module 3.'), ta), () => [
        el('button', { type: 'button', class: 'btn primary', onclick: () => { ta.select(); copyText(txt, 'Projet copié'); } }, 'Copier'),
        el('button', { type: 'button', class: 'btn', onclick: () => download(`droneforge-${SUM.designation}.json`, txt, 'application/json') }, 'Télécharger'),
      ]);
    });
    $('#btn-import').addEventListener('click', () => {
      const ta = el('textarea', { placeholder: 'Collez ici un projet DroneForge (JSON)', 'aria-label': 'Projet au format JSON' });
      const file = el('input', { type: 'file', accept: '.json,application/json', 'aria-label': 'Fichier projet' });
      file.addEventListener('change', () => { const f = file.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => { ta.value = r.result; }; r.readAsText(f); });
      modal('Importer un projet', el('div', { class: 'field' }, file, ta), close => [
        el('button', { type: 'button', class: 'btn primary', onclick: () => {
          try {
            const j = JSON.parse(ta.value);
            if (!j || j.format !== 'droneforge-project-2' || !j.state) throw new Error('fichier non reconnu');
            S = validateState(mergeState(defaultState(), j.state));
            store.set(STORE_KEY, S);
            close(); toast('Projet importé, rechargement…');
            setTimeout(() => location.reload(), 600);
          } catch (e) { toast(`Import impossible : ${e.message}`); }
        } }, 'Importer'),
        confirmButton('Réinitialiser le projet', 'Confirmer : tout effacer', () => { store.del(STORE_KEY); location.reload(); }, 'danger'),
      ]);
    });
  }

  /* ================= Clavier ================= */
  function initKeys() {
    const typing = e => /INPUT|TEXTAREA|SELECT/.test((e.target && e.target.tagName) || '') && e.target.type !== 'range' && e.target.type !== 'checkbox';
    document.addEventListener('keydown', e => {
      if (typing(e) || $('#modal-root').firstChild) return;
      const flying = S.ui.tab === 'simulation' && S.sim.mode === 'manual';
      if (!flying && !e.ctrlKey && !e.metaKey && !e.altKey && /^Digit[1-6]$/.test(e.code)) { setTab(TABS[Number(e.code.slice(5)) - 1]); return; }
      if (flying) {
        if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) e.preventDefault();
        keys[e.code] = true;
      }
    });
    document.addEventListener('keyup', e => { keys[e.code] = false; });
    window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
  }

  /* ================= Boucle principale ================= */
  let last = performance.now(), panelT = 0, diagT = 0;
  function frame(now) {
    requestAnimationFrame(frame);
    const dt = Math.min(0.05, Math.max(0, (now - last) / 1000)); last = now;
    pumpTraining();
    pumpLab();
    if (S.ui.tab === 'lab') updateLabLive(dt);
    if (S.ui.tab === 'simulation') simTick(dt);
    if (S.ui.tab === 'ai') demoTick(dt);
    const v = views[S.ui.tab];
    if (renderer && v) {
      // Garde-fous : taille du rendu toujours à jour, caméra jamais perdue (NaN ou trop loin)
      const cw = vp.clientWidth, ch = vp.clientHeight, sz = renderer.getSize(new THREE.Vector2());
      if (cw && ch && (Math.abs(sz.x - cw) > 1 || Math.abs(sz.y - ch) > 1)) resize();
      const p = camera.position;
      if (!Number.isFinite(p.x + p.y + p.z) || (controls && (!Number.isFinite(controls.target.x + controls.target.y + controls.target.z) || p.distanceTo(controls.target) < 1e-3))) applyCam(v, true);
      else if (controls && controls.maxDistance < Infinity && p.distanceTo(controls.target) > controls.maxDistance * 1.05) applyCam(v, true);
      v.update(dt); if (controls) controls.update(); renderer.render(v.scene, camera);
    }
    panelT += dt;
    if (panelT > 0.1) {
      panelT = 0;
      if (S.ui.tab === 'simulation') updateSimPanel();
      if (S.ui.tab === 'ai' || AI.running) updateAIPanel(false);
    }
  }

  /* ================= Erreurs visibles ================= */
  function showError(msg) {
    let b = document.getElementById('err-banner');
    if (!b) { b = el('div', { id: 'err-banner', role: 'alert', style: 'position:fixed;left:50%;top:12px;transform:translateX(-50%);z-index:80;max-width:min(720px,calc(100% - 32px));background:var(--panel-2);border:1px solid var(--bad);color:var(--fg);border-radius:8px;padding:10px 14px;font:12px/1.45 var(--font-mono);box-shadow:0 8px 30px rgba(0,0,0,.5)' }); document.body.append(b); }
    b.replaceChildren(el('b', { style: 'color:var(--bad);font-family:var(--font-ui)' }, 'Erreur DroneForge : '), String(msg).slice(0, 400), ' ', el('button', { type: 'button', class: 'btn small', onclick: () => b.remove() }, 'Fermer'));
  }
  window.addEventListener('error', e => showError(`${e.message} (${(e.filename || '').split('/').pop()}:${e.lineno})`));
  window.addEventListener('unhandledrejection', e => showError(e.reason && e.reason.message || e.reason));

  /* ================= Démarrage ================= */
  function boot() {
    init3D();
    if (HAS3D) {
      try { setupMotorView(); setupSimView(); setupAIView(); setupBoardView(); setupProdView(); }
      catch (e) { console.error(e); renderer = null; showFallback('Erreur lors de la construction des scènes 3D. Les calculs restent disponibles.'); }
    }
    buildMotorPanel(); buildSimPanel(); buildAIPanel(); buildBoardPanel(); buildProdPanel();
    initTabs(); initProjectButtons(); initKeys();
    updateHeader(); updateMotorPanel(); updateBoardPanel(); updateProdPanel();
    if (HAS3D) { rebuildMotor(); rebuildSimDrone(); rebuildWaypoints(); rebuildBoard(); rebuildProdDrone(); }
    setTab(S.ui.tab);
    updateArmBtn();
    window.addEventListener('resize', () => { updateMotorPanel(); updateAIPanel(true); if (S.ui.tab === 'lab' && LB.live) { if (LB.live.board && LB.boardCharts) LB.boardCharts(); else if (LB.live.m && LAB.sub === 'train') updateLabTrain(LB.live.m); } });
    window.addEventListener('beforeunload', () => { store.set(STORE_KEY, S); if (AI.running) persistPolicy(); for (const [id, r] of LAB.rt) { const m = LAB.models.find(x => x.id === id); if (m && r.running) DFLab.storeWeights(m, r.R); } labSave(true); });
    document.addEventListener('visibilitychange', () => { last = performance.now(); });
    requestAnimationFrame(frame);
  }
  boot();
})();

</script>
</body>
</html>
